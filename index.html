<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expense Tracker</title>

<!-- App icon — references icon.png uploaded to this same GitHub repo -->
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expense Tracker">
<meta name="mobile-web-app-capable" content="yes">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<script>
  // ⚙️ CUSTOM:- Replace with YOUR Apps Script deployment URL
  var appsScriptUrl = 'https://script.google.com/macros/s/AKfycbxV0dox4y8l8mvxR8Amt_jub-e-S15xfZRR_sYzY9RmdkwXbpFwDt3yfaN0O6YLJmEl/exec';

  // Reads ?fid= from URL and passes it to the Apps Script app
  var params = new URLSearchParams(window.location.search);
  var fid = params.get('fid') || '';
  var src = appsScriptUrl + (fid ? '?fid=' + encodeURIComponent(fid) : '');

  var iframe = document.createElement('iframe');
  iframe.src = src;
  document.body.appendChild(iframe);
</script>
</body>
</html>
